template: testify
template-data:
  unroll-variadic: true
filename: "{{.InterfaceName}}.go"
include-auto-generated: true
packages:
  go.lumeweb.com/ipfs-sdk:
    config:
      dir: ./mocks
      pkgname: "mocks"
    interfaces:
      DNSClientWithResponsesInterface: {}
      IPNSClientWithResponsesInterface: {}
      WebsitesClientWithResponsesInterface: {}
  go.lumeweb.com/ipfs-sdk/internal/download:
    config:
      dir: ./mocks
      pkgname: "mocks"
    interfaces:
      Backend: {}
  go.lumeweb.com/ipfs-sdk/internal/testing:
    config:
      dir: ./internal/testing/mocks
      pkgname: "testingmocks"
    interfaces:
      Blockstore: {}

