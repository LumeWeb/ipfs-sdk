unroll-variadic: true
filename: "{{.InterfaceName}}.go"
packages:
  go.lumeweb.com/ipfs-sdk:
    config:
      dir: ./mocks
      outpkg: mocks
    interfaces:
      BlockMetaClient: {}
      DAGClientWithResponsesInterface: {}
      DAGService:
        config:
          dir: ./mocks/services
          outpkg: servicemocks
      DNSClientWithResponsesInterface: {}
      DNSService:
        config:
          dir: ./mocks/services
          outpkg: servicemocks
      IPNSClientWithResponsesInterface: {}
      IPNSService:
        config:
          dir: ./mocks/services
          outpkg: servicemocks
      PinningService:
        config:
          dir: ./mocks/services
          outpkg: servicemocks
      WebsitesClientWithResponsesInterface: {}
      WebsitesService:
        config:
          dir: ./mocks/services
          outpkg: servicemocks
  go.lumeweb.com/ipfs-sdk/fs:
    config:
      dir: ./mocks
      outpkg: mocks
    interfaces:
      DirEntry: {}
      DirIterator: {}
      Directory: {}
      File: {}
      FileInfo: {}
      Node: {}
  go.lumeweb.com/ipfs-sdk/internal/download:
    config:
      dir: ./mocks
      outpkg: mocks
    interfaces:
      Backend: {}
      Blockstore: {}
  go.lumeweb.com/ipfs-sdk/internal/testing:
    config:
      dir: ./internal/testing/mocks
      outpkg: testingmocks
    interfaces:
      Blockstore: {}
